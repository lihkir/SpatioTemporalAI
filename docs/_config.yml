# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Modelos Espacio-Temporales
author: "Lihki Rubio, Ph.D."
logo: fotolihki.jpg

# copyright: "Doctor en Ingeniería Matemática"
# Patterns to skip when building the book. Can be glob-style (e.g. "*skip.ipynb")
exclude_patterns            : [_build, Thumbs.db, .DS_Store, "**.ipynb_checkpoints"]
# Auto-exclude files not in the toc
only_build_toc_files        : false

extra_css:
  - custom.css
  
extra_js:
  - custom.js

extensions:
  - sphinx_togglebutton

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: false

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

sphinx:
  config:
    suppress_warnings: ["mystnb.unknown_mime_type"]
    bibtex_reference_style: author_year
    html_js_files:
    - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    mathjax_path: https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js
    latex_elements:
      preamble: '\usepackage{pxfonts}'
  extra_extensions:
    - sphinx_proof
    - sphinx_togglebutton

parse:
    myst_url_schemes: [mailto, http, https]

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
    use_issues_button: false
    use_repository_button: false
    extra_footer: "<p>Lihki Rubio, Ph.D. All rights reserved.</p>"
    show_navbar_depth: 2
    use_download_button: false